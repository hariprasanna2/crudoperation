spring.application.name=crudoperation

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Learning default; use migrations and DDL_AUTO=validate for deployed databases.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mvc.problemdetails.enabled=true

server.port=${PORT:8080}

# Required API credentials, separate from MySQL credentials. No default accounts.
app.security.admin-username=${API_ADMIN_USERNAME}
app.security.admin-password=${API_ADMIN_PASSWORD}
app.security.user-username=${API_USER_USERNAME}
app.security.user-password=${API_USER_PASSWORD}
app.security.jwt-secret=${JWT_SECRET}
